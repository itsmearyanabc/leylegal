# =============================================================================
# leylegal.in — nginx vhost
#
# Use this file if nginx is ALREADY serving something else on this box. Adding a
# server block is additive; installing Caddy alongside a running nginx is not,
# because both want ports 80 and 443 and the loser fails to start. On a host
# with other production apps, that is the difference between a deploy
# and an outage.
#
#   sudo cp deploy/nginx-leylegal.conf /etc/nginx/sites-available/leylegal.in
#   sudo ln -s /etc/nginx/sites-available/leylegal.in /etc/nginx/sites-enabled/
#   sudo nginx -t          # MUST pass before reloading
#   sudo systemctl reload nginx
#
# `nginx -t` is not optional here. `reload` on a broken config leaves the old
# one running, but `restart` does not, and a typo would take other sites on
# this box down with it.
# =============================================================================

# -----------------------------------------------------------------------------
# Cloudflare sends the visitor's address in CF-Connecting-IP; without this every
# request appears to originate from Cloudflare.
#
# That is not cosmetic. The application rate-limits sign-ins per IP, so with all
# traffic sharing one apparent address, twenty failed logins from anywhere on
# the internet would lock out every advocate at once. It also makes the
# signed-in device list meaningless.
#
# Ranges from https://www.cloudflare.com/ips/ — they change rarely; check yearly.
# -----------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream leylegal_web {
    # Must match PORT in .env.
    server 127.0.0.1:3001;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# Port 80 redirect to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name leylegal.in www.leylegal.in;
    return 301 https://leylegal.in$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.leylegal.in;

    ssl_certificate     /etc/ssl/cloudflare/leylegal.in.pem;
    ssl_certificate_key /etc/ssl/cloudflare/leylegal.in.key;

    return 301 https://leylegal.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leylegal.in;

    ssl_certificate     /etc/ssl/cloudflare/leylegal.in.pem;
    ssl_certificate_key /etc/ssl/cloudflare/leylegal.in.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_leylegal:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    access_log /var/log/nginx/leylegal.access.log;
    error_log  /var/log/nginx/leylegal.error.log;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # -------------------------------------------------------------------------
    # The chat stream.
    # -------------------------------------------------------------------------
    location = /api/chat/ask {
        proxy_pass http://leylegal_web;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Meta's WhatsApp webhook.
    # -------------------------------------------------------------------------
    location /webhooks/ {
        proxy_pass http://leylegal_web;
        proxy_http_version 1.1;
        proxy_request_buffering on;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://leylegal_web;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
